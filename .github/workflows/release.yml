name: Tag the release

# Every merge into main is a release (main is what people use). The number and the notes are a judgement
# call and live in src/version.ts, written in the feature's own pull request; everything after that is
# mechanical, so it happens here: check the mirrors agree, then tag and publish the release. A merge that
# doesn't bump the version (docs, tests, refactors) finds its tag already there and quietly does nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: version.ts, package.json and CHANGELOG.md must agree
        id: rel
        run: bun scripts/release.ts

      # every merge ships, so a pull request that doesn't move the version has nothing to release
      - name: The version must be one that hasn't gone out yet
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error file=src/version.ts::$tag is already released. Bump the version (at least the patch digit) and add a CHANGELOG entry for it."
            exit 1
          fi
          echo "$tag is new."

      # only ever from main: a pull request or a manual run on a branch just runs the check above
      - name: Tag and publish, unless this version already went out
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.rel.outputs.version }}
          TITLE: ${{ steps.rel.outputs.title }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released: nothing to do."
            exit 0
          fi
          # gh tags the merge commit itself: a runner has no git identity, so `git tag -a` would fail here
          gh release create "$tag" --target "$GITHUB_SHA" --title "$VERSION: $TITLE" --notes-file release-notes.md
          echo "Released [$tag]($(gh release view "$tag" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"
